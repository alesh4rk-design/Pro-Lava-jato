<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.workers.dev https://identitytoolkit.googleapis.com http://127.0.0.1:8787 http://127.0.0.1:9099; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0a6e7d">
  <title>Caixa · Lava-Jato Gestão</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/mobile.css">
  <script type="module" src="js/caixa.js"></script>
</head>
<body data-page="caixa" data-scope="tenant">
  <main class="page">
    <div class="page-title">
      <h1>Caixa</h1>
      <span class="badge badge-primary" id="period-label"></span>
    </div>

    <div class="chips" role="group" aria-label="Período" id="period-chips"></div>

    <section class="card cash-summary" id="cash-summary" aria-live="polite"></section>

    <section class="section">
      <h2 class="section-title">Lançamentos</h2>
      <div class="field">
        <label class="sr-only" for="cash-search">Pesquisar lançamentos</label>
        <input class="input" id="cash-search" type="search" placeholder="Pesquisar descrição, serviço ou categoria" maxlength="60" autocomplete="off">
      </div>
      <div class="chips" role="group" aria-label="Tipo de lançamento" id="kind-chips">
        <button class="chip" type="button" data-kind="" aria-pressed="true">Tudo</button>
        <button class="chip" type="button" data-kind="IN" aria-pressed="false">Entradas</button>
        <button class="chip" type="button" data-kind="OUT" aria-pressed="false">Saídas</button>
      </div>
      <div class="chips" role="group" aria-label="Forma de pagamento" id="method-chips"></div>
      <label class="switch" for="show-cancelled">Mostrar cancelados <input type="checkbox" id="show-cancelled"></label>
      <ul class="list entry-list" id="cash-entries"></ul>
      <button class="btn btn-outline btn-block" type="button" id="load-more" hidden>Carregar mais</button>
    </section>
  </main>
</body>
</html>
