<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.workers.dev http://127.0.0.1:8787; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0a6e7d">
  <title>Configurações · Lava-Jato Gestão</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/mobile.css">
  <script type="module" src="js/configuracoes.js"></script>
</head>
<body data-page="mais" data-scope="tenant" data-roles="ADMIN">
  <main class="page">
    <div class="page-title"><h1>Configurações</h1></div>
    <form class="card form" id="settings-form" novalidate>
      <div class="field">
        <label for="s-name">Nome do lava-jato</label>
        <input class="input" id="s-name" type="text" maxlength="80" autocomplete="organization" required>
        <span class="hint">Aparece no topo do app para todos os usuários.</span>
        <span class="field-error" id="s-name-error"></span>
      </div>
      <div class="field">
        <label for="s-phone">Telefone / WhatsApp <span class="muted">(opcional)</span></label>
        <input class="input" id="s-phone" type="tel" inputmode="tel" maxlength="20" autocomplete="tel">
        <span class="field-error" id="s-phone-error"></span>
      </div>
      <button class="btn btn-primary btn-lg" type="submit" id="s-save">Salvar</button>
    </form>
    <p class="hint" id="s-tz"></p>
  </main>
</body>
</html>
