<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.workers.dev https://identitytoolkit.googleapis.com http://127.0.0.1:8787 http://127.0.0.1:9099; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0a6e7d">
  
  <title>Agenda · Lava-Jato Gestão</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/mobile.css">
  <script type="module" src="js/agenda.js"></script>
</head>
<body data-back="mais.html" data-back-label="Voltar para Mais" data-page="mais" data-scope="tenant">
  <main class="page">
    <div class="page-title">
      <h1>Agenda</h1>
      <div class="title-actions">
        <a class="btn btn-outline" href="agenda-config.html" data-requires-role="ADMIN" hidden>Link de agendamento</a>
        <button class="btn btn-primary" type="button" id="new-item">
          <svg class="icon icon-sm" aria-hidden="true"><use href="assets/icons.svg#plus"></use></svg>
          <span>Novo</span>
        </button>
      </div>
    </div>
    <div class="day-nav">
      <button class="btn btn-outline" type="button" id="day-prev" aria-label="Dia anterior">&lsaquo;</button>
      <input class="input" id="day-input" type="date" aria-label="Dia">
      <button class="btn btn-outline" type="button" id="day-next" aria-label="Próximo dia">&rsaquo;</button>
      <button class="btn btn-outline" type="button" id="day-today">Hoje</button>
    </div>
    <div class="section" id="agenda-list" aria-live="polite"></div>
  </main>
</body>
</html>
