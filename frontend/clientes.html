<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.workers.dev https://identitytoolkit.googleapis.com http://127.0.0.1:8787 http://127.0.0.1:9099; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0a6e7d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LJ Gestão">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Clientes · Lava-Jato Gestão</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/mobile.css">
  <script type="module" src="js/clientes.js"></script>
</head>
<body data-back="mais.html" data-back-label="Voltar para Mais" data-page="mais" data-scope="tenant">
  <main class="page">
    <div class="page-title">
      <h1>Clientes</h1>
      <button class="btn btn-primary" type="button" id="new-item">
        <svg class="icon icon-sm" aria-hidden="true"><use href="assets/icons.svg#plus"></use></svg>
        <span id="new-item-label">Novo</span>
      </button>
    </div>
    <div class="chips" role="group" aria-label="Seção" id="tabs">
      <button class="chip" type="button" data-tab="clientes" aria-pressed="true">Clientes</button>
      <button class="chip" type="button" data-tab="mensagens" aria-pressed="false" data-requires-role="ADMIN" hidden>Mensagens prontas</button>
    </div>

    <section id="panel-clientes" class="section">
      <input class="input" id="customer-search" type="search" placeholder="Buscar por nome, telefone ou placa" maxlength="60" aria-label="Buscar cliente" autocomplete="off">
      <div class="section" id="customer-list" aria-live="polite"></div>
    </section>

    <section id="panel-mensagens" class="section" hidden>
      <p class="muted">Textos prontos para enviar pelo WhatsApp. Use <strong>{nome}</strong>, <strong>{veiculo}</strong>, <strong>{placa}</strong> e <strong>{lavajato}</strong>: o app troca pelos dados do cliente na hora de enviar.</p>
      <div class="section" id="template-list" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>
