<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.workers.dev https://identitytoolkit.googleapis.com http://127.0.0.1:8787 http://127.0.0.1:9099; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0a6e7d">
  <title>Lançar · Lava-Jato Gestão</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/mobile.css">
  <script type="module" src="js/lancamento.js"></script>
</head>
<body data-page="lancamento" data-scope="tenant">
  <main class="page">
    <div class="page-title"><h1>Lançar</h1></div>
    <p class="muted">O que você quer registrar?</p>
    <div class="quick-actions">
      <button class="action-tile action-tile-lg tile-in" type="button" id="new-revenue">
        <span class="tile-icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#arrow-up"></use></svg></span>
        <span>Receita<small>Serviço realizado ou outra entrada</small></span>
      </button>
      <button class="action-tile action-tile-lg tile-out" type="button" id="new-expense">
        <span class="tile-icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#arrow-down"></use></svg></span>
        <span>Despesa<small>Aluguel, materiais, contas…</small></span>
      </button>
      <button class="action-tile action-tile-lg tile-stock" type="button" id="new-stock">
        <span class="tile-icon"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#droplet"></use></svg></span>
        <span>Produto / insumo<small>Compra, consumo ou ajuste de estoque</small></span>
      </button>
    </div>
  </main>
</body>
</html>
